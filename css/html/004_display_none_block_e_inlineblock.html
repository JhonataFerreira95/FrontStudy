<!DOCTYPE html>
<html lang="br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../004_display_none_block_e_inlineblock.css">
    <title>Display: inline, block e inline-block</title>

</head>

<body>

    <main>
        <h1>Propriedade Display</h1>

        <p>Este é um <span class="inline">elemento inline</span>, ou seja, se, quebra de linha</p>
        <p>Este é um <span class="block">elemento block</span>, ou seja, com quebra de linha</p>
        <p>Este é um <span class="inline-block">elemento inline-block</span>, ou seja, sem quebra de linha mas com margem</p>
        <p>Este é um <span class="none">elemento em none</span>, ou seja, sem alteração vísivil no navegador</p>
    </main>

</body>
</html>
