<!DOCTYPE html>
<html lang="br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de inscrição</title>

</head>

<body>
    
<h1>Formulário de inscrição</h1>

<div><label for="nome">Nome:</label></div>
<input type="text" id="nome" name="nome">

<br><br>

<div><label for="email">Email:</label></div>
<input type="email" id="email" name="email">

<br><br>

<div><label for="whatsapp">WhatsApp:</label></div>
<input type="number" id="whatsapp" name="whatsapp">

<br><br>

<p href="">Área de atuação:

<br>

<input type="radio" name="desenvolvimento" id="desenvolvimento" value="desenvolvimento">
<label for="desenvolvimento">Desenvolvimento</label>
<input type="radio" name="infroestrutura" id="infroestrutura" value="infroestrutura">
<label for="infroestrutura">Infroestrutura</label>
<input type="radio" name="analise" id="analise" value="analise">
<label for="analise">Ánalise de Dados</label>
<input type="radio" name="qa" id="qa" value="qa">
<label for="qa">QA</label>

</P>


<label for="observacoes">Observações: </label>

<div>

<textarea name="observacoes" id="observacoes" cols="30" rows="5" placeholder="Digite alguma observação importante sobre você..."></textarea>

</div>

<br>

<input type="checkbox" id="caixa" name="caixa">
<label for="checkbox">Desejo enviar novidade por email.</label>
<div><button id="caixa" name="caixa">enviar</button></div>



</body>
</html>
